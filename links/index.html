<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Designs by Salz — Links</title>

<style>
  :root { --mint:#3fe1d0; --mint-12:rgba(63,225,208,0.12); --mint-20:rgba(63,225,208,0.2); --mint-45:rgba(63,225,208,0.45); --head:"Avenir Next Condensed","Helvetica Neue","Arial Narrow",Arial,sans-serif; --body:"Avenir Next","Helvetica Neue",Helvetica,Arial,sans-serif; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#000; color:#fff; font-family:var(--body); min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:56px 22px 40px; }
  ::selection { background:var(--mint); color:#000; }
  .logo { height:74px; filter:drop-shadow(0 0 20px rgba(63,225,208,0.4)); }
  h1 { font-family:var(--head); font-weight:800; font-size:30px; letter-spacing:3px; text-transform:uppercase; margin:20px 0 4px; }
  h1 em { font-style:normal; color:var(--mint); }
  .tag { color:rgba(255,255,255,0.5); font-size:11px; letter-spacing:3.5px; text-transform:uppercase; margin-bottom:8px; }
  .avail { display:inline-flex; align-items:center; gap:8px; font-size:10px; letter-spacing:2.5px; color:var(--mint); margin-bottom:30px; }
  .avail .dot { width:7px; height:7px; border-radius:50%; background:var(--mint); box-shadow:0 0 8px var(--mint); animation:pulse 1.6s infinite; }
  @keyframes pulse { 50%{opacity:.35} }
  .links { display:flex; flex-direction:column; gap:13px; width:100%; max-width:420px; }
  .links a { display:flex; align-items:center; justify-content:center; gap:10px; text-decoration:none; color:#fff; border:1px solid var(--mint-45); padding:17px; font-size:13px; letter-spacing:3px; transition:all .25s; position:relative; overflow:hidden; }
  .links a::before { content:''; position:absolute; bottom:0; left:-30%; width:26%; height:2px; background:linear-gradient(90deg,transparent,var(--mint) 80%,#eafffb); box-shadow:0 0 10px 1px var(--mint-45); opacity:0; }
  .links a:hover { border-color:var(--mint); box-shadow:0 0 24px var(--mint-20); transform:translateY(-2px); }
  .links a:hover::before { opacity:1; animation:led 1.6s linear infinite; }
  @keyframes led { to { left:110%; } }
  .links a.hot { background:var(--mint); color:#000; font-weight:700; border-color:var(--mint); }
  footer { margin-top:auto; padding-top:36px; color:rgba(255,255,255,0.35); font-size:10px; letter-spacing:2.5px; }
  footer a { color:rgba(255,255,255,0.55); }

  @view-transition { navigation: auto; }
  ::view-transition-old(root) { animation: vtOut 0.28s ease forwards; }
  ::view-transition-new(root) { animation: vtIn 0.3s ease; }
  @keyframes vtOut { to { opacity: 0; transform: scale(0.985); } }
  @keyframes vtIn { from { opacity: 0; transform: scale(1.012); } }
  .brand img, .brand .js-img { view-transition-name: dbs-logo; }
</style>
</head>
<body>
  <img class="logo" src="../logo.png" alt="Designs by Salz">
  <h1>DESIGNS<em>BY</em>SALZ</h1>
  <div class="tag">Sports Graphic Designer</div>
  <span class="avail"><span class="dot"></span>ACCEPTING NEW PROJECTS</span>
  <div class="links">

    <a href="../#work">VIEW THE ARCHIVE</a>
    <a href="../course/">THE DESIGN COURSE — FOUNDING LIST</a>
    <a href="../schools/">FOR SCHOOLS &amp; PROGRAMS</a>
    <a href="https://www.instagram.com/designsbysalz/" target="_blank" rel="noopener">INSTAGRAM — @DESIGNSBYSALZ</a>
    <a href="../resume.pdf">RESUME</a>
    <a href="https://www.linkedin.com/in/jonah-salz-b10164388/" target="_blank" rel="noopener">LINKEDIN</a>
    <a href="mailto:jsalz3120@gmail.com">EMAIL ME</a>
  </div>
  <footer>© 2026 DESIGNS BY SALZ — <a href="../">DESIGNSBYSALZ.NET</a></footer>
</body>
</html>
