<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Status — Designs by Salz</title>
<link rel="icon" href="../favicon.ico" sizes="any">
<meta name="description" content="Track your Designs by Salz project with your DBS reference number.">
<style>
  :root { --mint:#3fe1d0; --mint-12:rgba(63,225,208,0.12); --mint-20:rgba(63,225,208,0.2); --mint-45:rgba(63,225,208,0.45); --w-60:rgba(255,255,255,0.6); --w-40:rgba(255,255,255,0.4); --head:"Avenir Next Condensed","Helvetica Neue","Arial Narrow",Arial,sans-serif; --body:"Avenir Next","Helvetica Neue",Helvetica,Arial,sans-serif; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#000; color:#fff; font-family:var(--body); -webkit-font-smoothing:antialiased; }
  ::selection { background:var(--mint); color:#000; }
  nav { position:fixed; top:0; left:0; right:0; z-index:200; display:flex; justify-content:space-between; align-items:center; padding:16px 4vw; background:rgba(0,0,0,0.88); backdrop-filter:blur(12px); border-bottom:1px solid var(--mint-12); }
  .brand { font-family:var(--head); font-weight:700; font-size:16px; letter-spacing:3px; text-decoration:none; color:#fff; display:flex; align-items:center; gap:12px; }
  .brand em { font-style:normal; color:var(--mint); }
  .brand img { height:28px; }
  nav a.b { color:var(--w-60); text-decoration:none; font-size:11px; letter-spacing:2.5px; }
  nav a.b:hover { color:var(--mint); }
  main { max-width:760px; margin:0 auto; padding:160px 5vw 90px; }
  h1 { font-family:var(--head); font-weight:800; font-size:clamp(42px,7vw,86px); line-height:.92; text-transform:uppercase; }
  h1 span { color:var(--mint); }
  p.sub { color:var(--w-60); font-size:15px; line-height:1.75; margin:22px 0 34px; max-width:520px; }
  .lookup { display:flex; gap:12px; max-width:480px; }
  input { flex:1; background:#050505; border:1px solid var(--mint-45); color:#fff; font-family:var(--body); font-size:16px; letter-spacing:2px; padding:16px 18px; outline:none; text-transform:uppercase; }
  input:focus { box-shadow:0 0 18px var(--mint-12); }
  button { background:var(--mint); border:1px solid var(--mint); color:#000; font-weight:700; font-size:12px; letter-spacing:2.5px; padding:0 26px; cursor:pointer; transition:box-shadow .25s; }
  button:hover { box-shadow:0 0 24px var(--mint-45); }
  .rail { margin-top:56px; display:none; }
  .rail.on { display:block; animation:in .4s ease; }
  @keyframes in { from { opacity:0; transform:translateY(14px);} }
  .ref-line { font-size:12px; letter-spacing:3px; color:var(--mint); margin-bottom:26px; }
  .stages { position:relative; padding-left:34px; }
  .stages::before { content:''; position:absolute; left:6px; top:8px; bottom:8px; width:1px; background:var(--mint-12); }
  .st { position:relative; padding-bottom:30px; color:var(--w-40); font-size:14px; letter-spacing:1px; }
  .st::before { content:''; position:absolute; left:-34px; top:2px; width:13px; height:13px; border-radius:50%; background:#000; border:2px solid rgba(255,255,255,0.2); }
  .st.done { color:var(--w-60); }
  .st.done::before { border-color:var(--mint); background:var(--mint); box-shadow:0 0 10px var(--mint-45); }
  .st.now { color:#fff; font-weight:600; }
  .st.now::before { border-color:var(--mint); box-shadow:0 0 12px var(--mint); animation:pulse 1.6s infinite; }
  @keyframes pulse { 50%{opacity:.4} }
  .st .lbl { font-family:var(--head); font-size:17px; letter-spacing:2px; text-transform:uppercase; }
  .st .d { font-size:12px; margin-top:3px; }
  .note { margin-top:30px; border:1px solid var(--mint-20); background:rgba(63,225,208,0.04); padding:16px 18px; color:var(--w-60); font-size:13px; line-height:1.7; }
  footer { text-align:center; color:var(--w-40); font-size:11px; letter-spacing:2px; padding:50px 20px; }
  footer a { color:var(--w-60); }
</style>
</head>
<body>
<nav>
  <a class="brand" href="../"><img src="../logo.png" alt=""><span>DESIGNS<em>BY</em>SALZ</span></a>
  <a class="b" href="../booking/">BOOK A PROJECT</a>
</nav>
<main>
  <h1>PROJECT <span>STATUS</span></h1>
  <p class="sub">Enter the DBS reference number from your booking confirmation to see where your project is right now.</p>
  <div class="lookup">
    <input id="ref" placeholder="DBS-123456" maxlength="12" aria-label="DBS reference number">
    <button id="go">CHECK</button>
  </div>
  <div class="rail" id="rail">
    <div class="ref-line" id="refLine"></div>
    <div class="stages" id="stages"></div>
    <div class="note" id="note"></div>
  </div>
</main>
<footer>© 2026 DESIGNS BY SALZ · <a href="../">HOME</a> · <a href="mailto:jsalz3120@gmail.com">QUESTIONS? EMAIL ME</a></footer>
<script src="status.js"></script>
<script>
const STAGES = ['Received', 'In Queue', 'Drafting', 'In Review', 'Delivered'];
const $ = s => document.querySelector(s);
function check() {
  const ref = $('#ref').value.trim().toUpperCase().replace(/\s/g,'');
  if (!/^DBS-\d{4,8}$/.test(ref)) { alert('Enter a reference like DBS-123456 (it\'s in your confirmation).'); return; }
  const rec = (typeof STATUS !== 'undefined' && STATUS[ref]) || null;
  const stage = rec ? rec.stage : 0;
  $('#refLine').textContent = ref + (rec && rec.updated ? ' — UPDATED ' + rec.updated.toUpperCase() : '');
  $('#stages').innerHTML = STAGES.map((s, i) => `
    <div class="st ${i < stage ? 'done' : ''} ${i === stage ? 'now' : ''}">
      <div class="lbl">${s}</div>
      <div class="d">${i === stage ? (rec && rec.note ? rec.note : ({0:'Your request is in — I review new submissions personally and reply with availability and pricing.',1:'Confirmed and scheduled. You\'re in the lineup.',2:'Actively designing. This is the fun part.',3:'A proof is with you (or on its way) — check your email/DMs.',4:'Delivered! Check your inbox for final files.'})[i] : ''}</div>
    </div>`).join('');
  $('#note').innerHTML = rec ? 'Questions about this project? Reply to our email thread or DM <b>@designsbysalz</b>.' :
    'This reference isn\'t in the tracker yet — that\'s normal right after submitting. Every request starts in <b>Received</b>, and I update this page as your project moves. If it\'s been more than 2 days, email <a href="mailto:jsalz3120@gmail.com" style="color:var(--mint)">jsalz3120@gmail.com</a>.';
  $('#rail').classList.add('on');
}
$('#go').onclick = check;
$('#ref').addEventListener('keydown', e => { if (e.key === 'Enter') check(); });
const qs = new URLSearchParams(location.search);
if (qs.get('ref')) { $('#ref').value = qs.get('ref'); check(); }
</script>
</body>
</html>
