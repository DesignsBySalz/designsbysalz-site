<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<title>Timeout — Designs by Salz</title>
<style>
  :root { --mint:#3fe1d0; --mint-20:rgba(63,225,208,0.2); --mint-45:rgba(63,225,208,0.45); --head:"Avenir Next Condensed","Helvetica Neue","Arial Narrow",Arial,sans-serif; --body:"Avenir Next","Helvetica Neue",Helvetica,Arial,sans-serif; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#000; color:#fff; font-family:var(--body); min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:24px; }
  .hands { font-size:44px; margin-bottom:8px; animation: tee 2.6s ease-in-out infinite; display:inline-block; }
  @keyframes tee { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-10px); } }
  .big { font-family:var(--head); font-weight:800; font-size:clamp(70px,20vw,220px); line-height:.9; color:transparent; -webkit-text-stroke:2px var(--mint); filter:drop-shadow(0 0 30px rgba(63,225,208,0.25)); }
  h1 { font-family:var(--head); font-weight:800; font-size:clamp(26px,6vw,50px); text-transform:uppercase; margin:20px 0 10px; }
  h1 span { color:var(--mint); }
  p { color:rgba(255,255,255,0.6); font-size:15px; line-height:1.7; max-width:420px; }
  button { margin-top:32px; background:var(--mint); border:1px solid var(--mint); color:#000; font-weight:700; font-size:12px; letter-spacing:3px; padding:15px 32px; cursor:pointer; font-family:var(--body); }
  button:hover { box-shadow:0 0 26px var(--mint-45); }
  @media (prefers-reduced-motion:reduce){ .hands { animation:none; } }
</style>
</head>
<body>
  <span class="hands">🙌</span>
  <div class="big">TIMEOUT</div>
  <h1>YOU'RE <span>OFFLINE.</span></h1>
  <p>The refs are reviewing your connection. The archive needs wifi or signal — reconnect and we'll resume play.</p>
  <button onclick="location.reload()">RESUME PLAY ↻</button>
</body>
</html>
